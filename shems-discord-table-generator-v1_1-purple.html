<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shem's Discord Table [Generator] — Purple</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: hsl(220, 20%, 8%);
    --surface: hsl(220, 18%, 11%);
    --surface2: hsl(220, 18%, 13%);
    --surface3: hsl(220, 18%, 16%);
    --border: hsl(220, 15%, 20%);
    --border2: hsl(220, 15%, 26%);
    --gold: hsl(250, 60%, 72%);
    --gold-dim: hsl(250, 40%, 45%);
    --gold-glow: hsla(250, 60%, 65%, 0.12);
    --text: hsl(220, 15%, 90%);
    --text-muted: hsl(220, 10%, 55%);
    --text-dim: hsl(220, 10%, 35%);
    --red: #c0392b;
    --green: #27ae60;
    --mono: 'JetBrains Mono', monospace;
    --display: 'Syne', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: linear-gradient(135deg, hsl(250,60%,12%) 0%, hsl(220,20%,8%) 50%, hsl(280,40%,10%) 100%) fixed;
    background-color: hsl(220, 20%, 8%);
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    min-height: 100vh;
    padding: 0 0 60px;
  }
  header {
    background: hsl(240, 18%, 12%);
    border-bottom: 1px solid hsl(250, 30%, 25%);
    padding: 20px 32px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .logo-icon {
    width: 42px; height: 42px;
    border-radius: 8px;
    overflow: hidden;
    flex-shrink: 0;
  }
  .logo-icon img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    image-rendering: pixelated;
  }
  header h1 {
    font-family: var(--display);
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -0.3px;
    color: var(--text);
  }
  header p { color: var(--text-muted); font-size: 12px; margin-top: 2px; }

  .container { max-width: 1100px; margin: 0 auto; padding: 32px 24px; }

  .grid-layout {
    display: grid;
    grid-template-columns: 1fr 340px;
    gap: 24px;
    align-items: start;
  }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .panel-header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .panel-title {
    font-family: var(--display);
    font-size: 13px;
    font-weight: 700;
    color: var(--gold);
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .panel-body { padding: 16px; }

  /* Table Editor */
  .table-scroll { overflow-x: auto; }
  #editor-table {
    border-collapse: collapse;
    min-width: 100%;
    font-family: var(--mono);
    font-size: 12px;
  }
  #editor-table td {
    border: 1px solid var(--border);
    padding: 0;
    min-width: 100px;
  }
  #editor-table td:first-child { min-width: 32px; }
  #editor-table tr:first-child td {
    background: var(--surface2);
    border-bottom: 2px solid var(--gold-dim);
  }
  #editor-table input {
    width: 100%;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: var(--mono);
    font-size: 12px;
    padding: 7px 9px;
    display: block;
  }
  #editor-table tr:first-child input { color: var(--gold); font-weight: 600; }
  #editor-table input:focus { background: var(--gold-glow); }
  #editor-table .row-num {
    color: var(--text-dim);
    font-size: 10px;
    text-align: center;
    padding: 6px 4px;
    background: var(--surface2);
    border-right: 1px solid var(--border);
    min-width: 28px;
    user-select: none;
  }
  #editor-table .del-row-btn {
    background: transparent; border: none; cursor: pointer;
    color: var(--text-dim); font-size: 14px; line-height: 1;
    padding: 2px 6px;
    transition: color 0.15s;
  }
  #editor-table .del-row-btn:hover { color: var(--red); }

  .row-controls {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    border-top: 1px solid var(--border);
    background: var(--surface2);
    flex-wrap: wrap;
  }

  /* Buttons */
  .btn {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
    padding: 7px 14px;
    border-radius: 6px;
    border: 1px solid var(--border2);
    cursor: pointer;
    background: var(--surface2);
    color: var(--text-muted);
    letter-spacing: 0.3px;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .btn:hover { border-color: var(--gold-dim); color: var(--text); background: var(--gold-glow); }
  .btn:active { transform: scale(0.97); }
  .btn-gold {
    background: var(--gold-glow);
    border-color: var(--gold-dim);
    color: var(--gold);
  }
  .btn-gold:hover { background: rgba(201,168,76,0.2); border-color: var(--gold); color: var(--gold); }
  .btn-danger { color: #e74c3c; border-color: #5a1a1a; background: rgba(192,57,43,0.08); }
  .btn-danger:hover { border-color: var(--red); background: rgba(192,57,43,0.18); }
  .btn-sm { padding: 5px 10px; font-size: 10px; }
  .spacer { flex: 1; }

  /* Format selector */
  .format-group { display: flex; flex-direction: column; gap: 8px; }
  .format-option {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: 7px;
    cursor: pointer;
    transition: all 0.15s;
    background: var(--surface2);
  }
  .format-option:hover { border-color: var(--gold-dim); background: var(--gold-glow); }
  .format-option.active { border-color: var(--gold); background: var(--gold-glow); }
  .format-option input[type=radio] { display: none; }
  .format-dot {
    width: 12px; height: 12px;
    border-radius: 50%;
    border: 2px solid var(--border2);
    flex-shrink: 0;
    transition: all 0.15s;
  }
  .format-option.active .format-dot { background: var(--gold); border-color: var(--gold); }
  .format-label { font-size: 12px; color: var(--text-muted); }
  .format-option.active .format-label { color: var(--gold); }

  /* Output */
  #output-text {
    width: 100%;
    background: #0a0b0f;
    border: 1px solid var(--border);
    border-radius: 7px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 12px;
    padding: 12px;
    resize: vertical;
    min-height: 140px;
    outline: none;
    line-height: 1.5;
  }
  #output-text:focus { border-color: var(--gold-dim); }

  /* Image options */
  .option-group { margin-bottom: 14px; }
  .option-label {
    font-size: 10px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 7px;
  }
  .seg-group {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
  }
  .seg-btn {
    font-family: var(--mono);
    font-size: 10px;
    padding: 5px 10px;
    border-radius: 5px;
    border: 1px solid var(--border2);
    cursor: pointer;
    background: var(--surface2);
    color: var(--text-muted);
    transition: all 0.15s;
  }
  .seg-btn:hover { border-color: var(--gold-dim); color: var(--text); }
  .seg-btn.active { background: var(--gold-glow); border-color: var(--gold); color: var(--gold); }

  /* Image preview */
  #canvas-wrap {
    background: #111;
    border: 1px solid var(--border);
    border-radius: 7px;
    overflow: hidden;
    margin-top: 12px;
    min-height: 80px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #preview-canvas { max-width: 100%; display: block; }
  .preview-empty {
    color: var(--text-dim);
    font-size: 11px;
    padding: 24px;
    text-align: center;
  }

  .img-actions { display: flex; gap: 8px; margin-top: 10px; }

  label.color-pick {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    color: var(--text-muted);
  }
  label.color-pick input[type=color] {
    width: 30px; height: 24px;
    border: 1px solid var(--border2);
    border-radius: 4px;
    background: var(--surface2);
    cursor: pointer;
    padding: 0;
  }

  #custom-color-row { display: none; margin-top: 8px; }

  .notice {
    font-size: 10px;
    color: var(--text-dim);
    line-height: 1.6;
    padding-top: 8px;
    border-top: 1px solid var(--border);
    margin-top: 12px;
  }
  .toast {
    position: fixed;
    bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(60px);
    background: var(--surface3);
    border: 1px solid var(--gold-dim);
    color: var(--gold);
    font-family: var(--mono);
    font-size: 12px;
    padding: 10px 20px;
    border-radius: 7px;
    transition: transform 0.25s ease;
    z-index: 999;
    pointer-events: none;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  @media (max-width: 800px) {
    .grid-layout { grid-template-columns: 1fr; }
  }
</style>
</head>

    <p>Format and export tables for Discord [text & image]</p>

</header>

<div class="container">
  <div class="grid-layout">

    <!-- Left: Editor + Output -->
    <div style="display:flex;flex-direction:column;gap:20px;">

      <!-- Table Editor -->
      <div class="panel">
        <div class="panel-header">
          <span class="panel-title">Table Editor</span>
          <div style="display:flex;gap:6px;">
            <button class="btn btn-sm" onclick="addCol()">+ Col</button>
            <button class="btn btn-sm" onclick="removeLastCol()">- Col</button>
            <button class="btn btn-sm btn-danger" onclick="clearAll()">Clear</button>
          </div>
        </div>
        <div class="panel-body" style="padding:0;">
          <div class="table-scroll" style="padding:12px 12px 0;">
            <table id="editor-table"></table>
          </div>
          <div class="row-controls">
            <button class="btn btn-sm" onclick="addRow()">+ Row</button>
            <button class="btn btn-sm" onclick="removeLastRow()">- Row</button>
            <span class="spacer"></span>
            <button class="btn btn-gold" onclick="generateOutput()">&#9654; Generate Table</button>
          </div>
        </div>
      </div>

      <!-- Output -->
      <div class="panel">
        <div class="panel-header">
          <span class="panel-title">Text Output</span>
          <button class="btn btn-sm btn-gold" onclick="copyText()">Copy</button>
        </div>
        <div class="panel-body">
          <textarea id="output-text" readonly placeholder="Click 'Generate Table' to see output here..."></textarea>
        </div>
      </div>

    </div>

    <!-- Right: Options -->
    <div style="display:flex;flex-direction:column;gap:20px;">

      <!-- Format -->
      <div class="panel">
        <div class="panel-header">
          <span class="panel-title">Format</span>
        </div>
        <div class="panel-body">
          <div class="format-group">
            <label class="format-option active" onclick="setFormat('ascii')">
              <input type="radio" name="fmt" checked>
              <div class="format-dot"></div>
              <span class="format-label">ASCII Box</span>
            </label>
            <label class="format-option" onclick="setFormat('double-ascii')">
              <input type="radio" name="fmt">
              <div class="format-dot"></div>
              <span class="format-label">Double Line ASCII</span>
            </label>
            <label class="format-option" onclick="setFormat('double')">
              <input type="radio" name="fmt">
              <div class="format-dot"></div>
              <span class="format-label">Double Line Unicode</span>
            </label>
            <label class="format-option" onclick="setFormat('markdown')">
              <input type="radio" name="fmt">
              <div class="format-dot"></div>
              <span class="format-label">Markdown</span>
            </label>
          </div>
        </div>
      </div>

      <!-- Image Generation -->
      <div class="panel">
        <div class="panel-header">
          <span class="panel-title">Image</span>
        </div>
        <div class="panel-body">

          <div class="option-group">
            <div class="option-label">Font Size</div>
            <div class="seg-group">
              <button class="seg-btn" onclick="setFontSize(12,this)">Small</button>
              <button class="seg-btn active" onclick="setFontSize(14,this)">Medium</button>
              <button class="seg-btn" onclick="setFontSize(16,this)">Large</button>
              <button class="seg-btn" onclick="setFontSize(18,this)">XL</button>
            </div>
          </div>

          <div class="option-group">
            <div class="option-label">Background</div>
            <div class="seg-group">
              <button class="seg-btn active" onclick="setBg('discord',this)">Discord Dark</button>
              <button class="seg-btn" onclick="setBg('transparent',this)">Transparent</button>
              <button class="seg-btn" onclick="setBg('custom',this)">Custom</button>
            </div>
            <div id="custom-color-row">
              <label class="color-pick" style="margin-top:8px;">
                Color: <input type="color" id="custom-color" value="#1e2030" oninput="generateOutput()">
              </label>
            </div>
          </div>

          <button class="btn btn-gold" style="width:100%;margin-bottom:10px;" onclick="generateOutput()">&#9654; Generate Image</button>

          <div id="canvas-wrap">
            <div class="preview-empty">Preview appears after generating</div>
          </div>

          <div class="img-actions">
            <button class="btn" style="flex:1;" onclick="copyImage()">Copy Image</button>
            <button class="btn btn-gold" style="flex:1;" onclick="downloadImage()">Download</button>
          </div>

          <div class="notice">
            Transparent background uses a checkerboard pattern in preview only. Exported image will be truly transparent.
          </div>

        </div>
      </div>

    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let numRows = 4;
let numCols = 4;
let currentFormat = 'ascii';
let fontSize = 14;
let bgMode = 'discord';
let currentCanvas = null;

function buildTable() {
  const t = document.getElementById('editor-table');
  const old = [];
  const rows = t.rows;
  for (let r = 0; r < rows.length; r++) {
    old[r] = [];
    const cells = rows[r].querySelectorAll('input');
    cells.forEach((inp, c) => old[r][c] = inp.value);
  }
  t.innerHTML = '';
  for (let r = 0; r < numRows; r++) {
    const tr = t.insertRow();
    const numCell = tr.insertCell();
    numCell.className = 'row-num';
    numCell.textContent = r === 0 ? '#' : r;
    for (let c = 0; c < numCols; c++) {
      const td = tr.insertCell();
      const inp = document.createElement('input');
      inp.type = 'text';
      inp.placeholder = r === 0 ? `Header ${c+1}` : '';
      inp.value = (old[r] && old[r][c]) ? old[r][c] : '';
      inp.addEventListener('input', debounceGenerate);
      td.appendChild(inp);
    }
    if (r > 0) {
      const td = tr.insertCell();
      td.style.width = '28px';
      const btn = document.createElement('button');
      btn.className = 'del-row-btn';
      btn.textContent = '×';
      btn.title = 'Delete row';
      btn.onclick = () => deleteRow(r);
      td.appendChild(btn);
    } else {
      tr.insertCell();
    }
  }
}

function getTableData() {
  const t = document.getElementById('editor-table');
  const data = [];
  for (let r = 0; r < t.rows.length; r++) {
    const row = [];
    const inputs = t.rows[r].querySelectorAll('input');
    inputs.forEach(inp => row.push(inp.value || ''));
    data.push(row);
  }
  return data;
}

function addRow() { numRows++; buildTable(); }
function removeLastRow() { if (numRows > 2) { numRows--; buildTable(); } }
function addCol() { numCols++; buildTable(); }
function removeLastCol() { if (numCols > 1) { numCols--; buildTable(); } }
function deleteRow(r) { numRows--; const t = document.getElementById('editor-table'); t.deleteRow(r); numRows = t.rows.length; buildTable(); }
function clearAll() {
  if (!confirm('Clear all cell contents?')) return;
  document.querySelectorAll('#editor-table input').forEach(i => i.value = '');
  document.getElementById('output-text').value = '';
  document.getElementById('canvas-wrap').innerHTML = '<div class="preview-empty">Preview appears after generating</div>';
  currentCanvas = null;
}

function setFormat(f) {
  currentFormat = f;
  document.querySelectorAll('.format-option').forEach(el => el.classList.remove('active'));
  event.currentTarget.classList.add('active');
  generateOutput();
}

function setFontSize(s, btn) {
  fontSize = s;
  document.querySelectorAll('.seg-group button').forEach(b => {
    if (b.closest('.option-group') === btn.closest('.option-group')) b.classList.remove('active');
  });
  btn.classList.add('active');
  generateOutput();
}

function setBg(mode, btn) {
  bgMode = mode;
  const grp = btn.closest('.option-group');
  grp.querySelectorAll('.seg-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('custom-color-row').style.display = mode === 'custom' ? 'block' : 'none';
  generateOutput();
}

// Table generators
function colWidths(data) {
  const w = [];
  for (let c = 0; c < data[0].length; c++) {
    let max = 0;
    for (let r = 0; r < data.length; r++) max = Math.max(max, (data[r][c] || '').length);
    w[c] = Math.max(max, 3);
  }
  return w;
}

function pad(str, len) { return String(str).padEnd(len, ' '); }

function generateASCII(data) {
  const w = colWidths(data);
  const hr = '+' + w.map(n => '-'.repeat(n+2)).join('+') + '+';
  const hrHead = '+' + w.map(n => '='.repeat(n+2)).join('+') + '+';
  let out = '';
  data.forEach((row, ri) => {
    if (ri === 0) { out += hr + '\n'; }
    out += '| ' + row.map((c,i) => pad(c,w[i])).join(' | ') + ' |\n';
    out += (ri === 0 ? hrHead : hr) + '\n';
  });
  return '```\n' + out + '```';
}

function generateDoubleASCII(data) {
  const w = colWidths(data);
  const top = '+' + w.map(n => '='.repeat(n+2)).join('+') + '+';
  const mid = '+' + w.map(n => '='.repeat(n+2)).join('+') + '+';
  const row_sep = '+' + w.map(n => '-'.repeat(n+2)).join('+') + '+';
  let out = top + '\n';
  data.forEach((row, ri) => {
    out += '| ' + row.map((c,i) => pad(c,w[i])).join(' | ') + ' |\n';
    out += (ri === 0 ? mid : (ri < data.length-1 ? row_sep : top)) + '\n';
  });
  return '```\n' + out + '```';
}

function generateDoubleUnicode(data) {
  const w = colWidths(data);
  const h = (n, c) => c.repeat(n+2);
  const top = '╔' + w.map(n=>h(n,'═')).join('╦') + '╗';
  const mid = '╠' + w.map(n=>h(n,'═')).join('╬') + '╣';
  const sep = '╟' + w.map(n=>h(n,'─')).join('╫') + '╢';
  const bot = '╚' + w.map(n=>h(n,'═')).join('╩') + '╝';
  let out = top + '\n';
  data.forEach((row, ri) => {
    out += '║ ' + row.map((c,i) => pad(c,w[i])).join(' ║ ') + ' ║\n';
    if (ri === 0) out += mid + '\n';
    else if (ri < data.length - 1) out += sep + '\n';
    else out += bot + '\n';
  });
  return '```\n' + out + '```';
}

function generateMarkdown(data) {
  const w = colWidths(data);
  const header = '| ' + data[0].map((c,i) => pad(c,w[i])).join(' | ') + ' |';
  const divider = '| ' + w.map(n => ':' + '-'.repeat(n) + ':').join(' | ') + ' |';
  const rows = data.slice(1).map(row => '| ' + row.map((c,i) => pad(c,w[i])).join(' | ') + ' |');
  return [header, divider, ...rows].join('\n');
}

function getRawText(data) {
  const w = colWidths(data);
  const h = (n, c) => c.repeat(n+2);
  switch (currentFormat) {
    case 'ascii': {
      const hr = '+' + w.map(n => '-'.repeat(n+2)).join('+') + '+';
      const hrHead = '+' + w.map(n => '='.repeat(n+2)).join('+') + '+';
      let out = '';
      data.forEach((row, ri) => {
        if (ri === 0) out += hr + '\n';
        out += '| ' + row.map((c,i) => pad(c,w[i])).join(' | ') + ' |\n';
        out += (ri === 0 ? hrHead : hr) + '\n';
      });
      return out;
    }
    case 'double-ascii': {
      const top = '+' + w.map(n => '='.repeat(n+2)).join('+') + '+';
      const row_sep = '+' + w.map(n => '-'.repeat(n+2)).join('+') + '+';
      let out = top + '\n';
      data.forEach((row, ri) => {
        out += '| ' + row.map((c,i) => pad(c,w[i])).join(' | ') + ' |\n';
        out += (ri === 0 ? top : (ri < data.length-1 ? row_sep : top)) + '\n';
      });
      return out;
    }
    case 'double': {
      const top = '╔' + w.map(n=>h(n,'═')).join('╦') + '╗';
      const mid = '╠' + w.map(n=>h(n,'═')).join('╬') + '╣';
      const sep = '╟' + w.map(n=>h(n,'─')).join('╫') + '╢';
      const bot = '╚' + w.map(n=>h(n,'═')).join('╩') + '╝';
      let out = top + '\n';
      data.forEach((row, ri) => {
        out += '║ ' + row.map((c,i) => pad(c,w[i])).join(' ║ ') + ' ║\n';
        if (ri === 0) out += mid + '\n';
        else if (ri < data.length - 1) out += sep + '\n';
        else out += bot + '\n';
      });
      return out;
    }
    case 'markdown': {
      const header = '| ' + data[0].map((c,i) => pad(c,w[i])).join(' | ') + ' |';
      const divider = '| ' + w.map(n => ':' + '-'.repeat(n) + ':').join(' | ') + ' |';
      const rows = data.slice(1).map(row => '| ' + row.map((c,i) => pad(c,w[i])).join(' | ') + ' |');
      return [header, divider, ...rows].join('\n');
    }
  }
}

function generateOutput() {
  const data = getTableData();
  if (!data.length || !data[0].length) return;

  let text = '';
  switch (currentFormat) {
    case 'ascii':       text = generateASCII(data); break;
    case 'double-ascii':text = generateDoubleASCII(data); break;
    case 'double':      text = generateDoubleUnicode(data); break;
    case 'markdown':    text = generateMarkdown(data); break;
  }
  const ta = document.getElementById('output-text');
  ta.value = text;
  ta.style.height = 'auto';
  ta.style.height = ta.scrollHeight + 'px';
  drawCanvas(data);
}

function drawCanvas(data) {
  const raw = getRawText(data);
  const lines = raw.split('\n').filter(l => l.length > 0);

  const fSize = fontSize;
  const lineH = Math.round(fSize * 1.55);
  const padX = 20, padY = 16;

  const offC = document.createElement('canvas');
  const offCtx = offC.getContext('2d');
  offCtx.font = `${fSize}px "JetBrains Mono", monospace`;
  let maxW = 0;
  lines.forEach(l => { const m = offCtx.measureText(l); if (m.width > maxW) maxW = m.width; });

  const cw = Math.ceil(maxW) + padX * 2;
  const ch = lines.length * lineH + padY * 2;

  const canvas = document.createElement('canvas');
  canvas.width = cw;
  canvas.height = ch;
  const ctx = canvas.getContext('2d');

  // Background
  if (bgMode === 'transparent') {
    // checkerboard for preview only
    const sq = 12;
    for (let y = 0; y < ch; y += sq) {
      for (let x = 0; x < cw; x += sq) {
        ctx.fillStyle = ((Math.floor(x/sq)+Math.floor(y/sq))%2===0) ? '#ccc' : '#888';
        ctx.fillRect(x, y, sq, sq);
      }
    }
  } else {
    let bg = 'hsl(235, 18%, 20%)';
    if (bgMode === 'custom') bg = document.getElementById('custom-color').value;
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, cw, ch);
  }

  ctx.font = `${fSize}px "JetBrains Mono", monospace`;
  ctx.fillStyle = '#dcddde';

  // Header row highlight (first data line after top border)
  const headerRowIdx = lines.findIndex((l,i) => i > 0 && !l.startsWith('+') && !l.startsWith('╔') && !l.startsWith('╠') && !l.startsWith('╟') && !l.startsWith('╚'));
  if (headerRowIdx >= 0) {
    ctx.fillStyle = 'rgba(255,255,255,0.04)';
    ctx.fillRect(0, padY + headerRowIdx * lineH, cw, lineH);
    ctx.fillStyle = '#dcddde';
  }

  lines.forEach((line, i) => {
    const y = padY + i * lineH + fSize;
    if (i === headerRowIdx) {
      ctx.fillStyle = '#f6c90e';
      ctx.fillText(line, padX, y);
      ctx.fillStyle = '#dcddde';
    } else {
      ctx.fillText(line, padX, y);
    }
  });

  // Wrap in canvas-wrap
  const wrap = document.getElementById('canvas-wrap');
  wrap.innerHTML = '';
  canvas.style.maxWidth = '100%';
  wrap.appendChild(canvas);
  currentCanvas = { canvas, bgMode, data };
}

function getExportCanvas() {
  if (!currentCanvas) return null;
  const { canvas, data } = currentCanvas;
  if (bgMode !== 'transparent') return canvas;
  // Regenerate truly transparent
  const raw = getRawText(data);
  const lines = raw.split('\n').filter(l => l.length > 0);
  const fSize = fontSize;
  const lineH = Math.round(fSize * 1.55);
  const padX = 20, padY = 16;
  const offC = document.createElement('canvas');
  const offCtx = offC.getContext('2d');
  offCtx.font = `${fSize}px "JetBrains Mono", monospace`;
  let maxW = 0;
  lines.forEach(l => { const m = offCtx.measureText(l); if (m.width > maxW) maxW = m.width; });
  const cw = Math.ceil(maxW) + padX*2;
  const ch = lines.length * lineH + padY*2;
  const c2 = document.createElement('canvas');
  c2.width = cw; c2.height = ch;
  const ctx = c2.getContext('2d');
  ctx.clearRect(0,0,cw,ch);
  ctx.font = `${fSize}px "JetBrains Mono", monospace`;
  ctx.fillStyle = '#dcddde';
  const hri = lines.findIndex((l,i) => i > 0 && !l.startsWith('+') && !l.startsWith('╔') && !l.startsWith('╠') && !l.startsWith('╟') && !l.startsWith('╚'));
  lines.forEach((line, i) => {
    const y = padY + i * lineH + fSize;
    ctx.fillStyle = i === hri ? '#f6c90e' : '#dcddde';
    ctx.fillText(line, padX, y);
  });
  return c2;
}

async function copyText() {
  const val = document.getElementById('output-text').value;
  if (!val) { toast('Nothing to copy — generate first'); return; }
  await navigator.clipboard.writeText(val);
  toast('Copied to clipboard!');
}

async function copyImage() {
  const c = getExportCanvas();
  if (!c) { toast('Generate an image first'); return; }
  c.toBlob(async blob => {
    try {
      await navigator.clipboard.write([new ClipboardItem({'image/png': blob})]);
      toast('Image copied!');
    } catch { toast('Copy failed — try Download instead'); }
  });
}

function downloadImage() {
  const c = getExportCanvas();
  if (!c) { toast('Generate an image first'); return; }
  const a = document.createElement('a');
  a.download = 'discord-table.png';
  a.href = c.toDataURL('image/png');
  a.click();
  toast('Downloaded!');
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2200);
}

let debTimer;
function debounceGenerate() { clearTimeout(debTimer); debTimer = setTimeout(generateOutput, 300); }

// Init
buildTable();

// Pre-fill demo data
const demoHeaders = ['Market', 'Yes %', 'Volume', 'Result'];
const demoRows = [['BTC > 100k', '72%', '$48,200', 'Open'], ['ETH ETF','61%','$31,500','Open'],['Fed Cut Jun','44%','$19,800','Open']];
const allInputs = document.querySelectorAll('#editor-table input');
let idx = 0;
demoHeaders.forEach((v,i) => { if(allInputs[i]) allInputs[i].value = v; });
for (let r = 1; r <= demoRows.length; r++) {
  const rowInputs = document.querySelectorAll(`#editor-table tr:nth-child(${r+1}) input`);
  demoRows[r-1].forEach((v,c) => { if(rowInputs[c]) rowInputs[c].value = v; });
}
generateOutput();
</script>
